name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (domain)
        run: ./gradlew :domain:test

      # CLAUDE.md hard rule 2: domain/ stays pure Kotlin.
      - name: Assert domain has no android.* imports
        run: ./gradlew :domain:assertDomainIsPureKotlin

      - name: Lint
        run: ./gradlew ktlintCheck detekt

      - name: Assemble
        run: ./gradlew assembleDebug

      # The privacy invariant. If this ever passes when it shouldn't, our
      # headline claim to the jury is false. Do not disable it.
      # Verified red-able on 27 Aug 2026 — see docs/TASKS.md S0.2.
      - name: Assert no INTERNET permission
        run: ./gradlew assertNoInternetPermission

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kavach-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
